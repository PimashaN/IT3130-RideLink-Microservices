spring.application.name=fare-payment-service

server.port=${SERVER_PORT:8084}

# MongoDB (local instance) -- NOTE: Spring Boot 4 renamed spring.data.mongodb.uri -> spring.mongodb.uri
spring.mongodb.uri=mongodb://localhost:27017/ridelink_payments

# Fare calculation rates (LKR). total = (base + distanceKm * per-km + durationMinutes * per-minute) * surge
fare.base=150.00    
fare.per-km=50.00   
fare.per-minute=5.00
fare.surge-multiplier=1.00
fare.currency=LKR
